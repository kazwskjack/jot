<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原生工作簿查看器</title>
<style>
 html,body { margin: 0; height: 100%; font: 14px system-ui,sans-serif; color: #222; background: white; }
 body { display: flex; flex-direction: column; }
 header { padding: 0.5rem; border-bottom: 1px solid #ccc; }
 nav { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
 input,select,button { min-height: 2rem; } input { width: 4rem; } input[type=search] { width: 12rem; max-width: 100%; }
 #cell { display: block; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 5rem; overflow: auto; }
 #status { margin: 0.3rem 0; } #viewport { flex: 1; min-height: 24rem; position: relative; overflow: hidden; } #content { width: 100%; height: 100%; position: relative; overflow: hidden; }
 .jot-sheet-region-layer { position: absolute; inset: 0; z-index: 100; touch-action: none; cursor: crosshair; }
 .jot-sheet-region-box { position: absolute; box-sizing: border-box; border: 2px solid #2459bd; background: #2459bd22; pointer-events: none; }
 #region-status { display: block; height: 1.5rem; overflow: auto; } #region-controls input { width: 4rem; }
 .jot-native-cell-action { min-height: 2rem; padding: 0.4rem 0.8rem; border: 1px solid #ccc; border-radius: 999px; color: #222; background: white; box-shadow: 0 3px 12px #0002; font: 500 12px system-ui,sans-serif; white-space: nowrap; cursor: pointer; }
 .jot-native-cell-action:hover { background: #f5f5f5; } .jot-native-cell-action:focus-visible { outline: 2px solid #2459bd; outline-offset: 2px; }
</style></head><body>
<header><nav aria-label="原生工作表导航"><label>工作表 <select id="sheet" disabled></select></label><label>缩放 % <input id="zoom" type="number" min="10" max="400" step="10" value="100" disabled></label></nav>
<nav aria-label="原生工作簿跨表搜索"><label>查找 <input id="query" type="search" maxlength="200" disabled></label><button id="search" type="button" disabled>重新搜索</button><button id="match-previous" type="button" disabled>上一处</button><button id="match-next" type="button" disabled>下一处</button><output id="matches" aria-live="polite">尚未搜索</output><small>在可见工作表中搜索单元格显示值。</small><button id="search-batch-previous" type="button" disabled>上一批结果</button><button id="search-batch-next" type="button" disabled>下一批结果</button><small id="coverage" role="status"></small></nav>
<nav aria-label="原生单元格引用"><button id="cell-prepare" type="button" disabled>准备引用当前原生选区</button><output id="cell-status" role="status">选区快照保留最多100行、50列</output><label>原引用选区 <select id="cell-focus-range" disabled></select></label><button id="cell-locate" type="button" disabled>核对并定位原选区</button></nav>
<nav id="region-controls" aria-label="工作表区域截图"><button id="region-start" type="button" disabled>框选截图区域</button><button id="region-whole" type="button" disabled>整个工作表视口</button><label>X % <input id="region-x" type="number" min="0" max="100" step="0.1" disabled></label><label>Y % <input id="region-y" type="number" min="0" max="100" step="0.1" disabled></label><label>宽 % <input id="region-width" type="number" min="0" max="100" step="0.1" disabled></label><label>高 % <input id="region-height" type="number" min="0" max="100" step="0.1" disabled></label><button id="region-cancel" type="button" disabled>取消框选</button></nav><output id="region-status" role="status">选区后在查看器下方确认截图引用</output>
<output id="cell" aria-label="当前单元格及公式或显示值"></output><p id="status" role="status">等待读取原工作簿</p></header>
<div id="viewport"><main id="content" aria-label="原生工作簿视觉内容"></main></div>
<script type="module" nonce="__JOT_OFFICE_NONCE__" src="./frame.js"></script></body></html>
