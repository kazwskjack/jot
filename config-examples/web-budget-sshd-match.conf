# Gateway host only. Include after global settings, with the existing policy reviewed.
# This account permits only local forwarding to the Gateway loopback port.
Match User jot-budget-relay
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:18831
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    GatewayPorts no
    ForceCommand /bin/false
Match all
